# Time Crisis II (USA)
#
# hud_rect = x0 y0 x1 y1 [flat]: where the HUD is, as fractions of the presented picture (0,0 = top
# left). Inside these areas, pixels the HUD drew at the maximum depth are laid flat on the screen
# plane at once; outside them nothing is, so muzzle flashes and impacts (also drawn at the maximum)
# stay put. "flat" lays the whole area flat, including the translucent boxes behind the text, which
# the game draws without depth.
hud_rect = 0.00 0.00 0.43 0.09 flat   # score bar
hud_rect = 0.19 0.44 0.81 0.56        # prompts: PRESS RELOAD BUTTON AND ATTACK, WAIT, ACTION
hud_rect = 0.00 0.86 1.00 1.00 flat   # shots, life, time
